name: promote-staging
on:
  workflow_dispatch:
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions: contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch user-approved v7c staging build
        run: curl -fsSL "https://vivekpathak235.github.io/open-world-car-game/next/1-9-36-police-pursuit-v7c.html" -o index.html
      - name: verify exact approved bytes
        run: echo "cbe0c69caa61287352100890cab2c324  index.html" | md5sum -c -
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "LIVE: promote user-approved police pursuit v7c to main site" || echo "no change"
          git push
