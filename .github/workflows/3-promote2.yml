name: promote-staging-v7c
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://vivekpathak235.github.io/open-world-car-game/next/1-9-36-police-pursuit-v7c.html" -o index.html
      - run: echo "cbe0c69caa61287352100890cab2c324  index.html" | md5sum -c -
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "LIVE: promote user-approved police pursuit v7c to main site" || echo "no change"
          git push
